<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>4 Shops - Smart Shopping</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
header{background:linear-gradient(135deg,#2563eb,#4f46e5);color:white;padding:28px 18px;text-align:center}
header h1{margin:0 0 8px;font-size:30px}header p{margin:0;opacity:.9}
.container{max-width:1100px;margin:auto;padding:20px}
.cart{position:sticky;top:10px;z-index:5;background:white;border-radius:14px;padding:14px 18px;margin-bottom:20px;box-shadow:0 4px 18px #0001;display:flex;justify-content:space-between;align-items:center}
#total{font-weight:bold;font-size:20px;color:#2563eb}.shops{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.shop{background:white;border-radius:18px;padding:18px;box-shadow:0 5px 20px #00000012}
.shop h2{margin:0 0 5px}.shop small{color:#687386}.item{border-top:1px solid #eee;padding:14px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}
.item strong{display:block}.price{color:#2563eb;font-weight:bold;margin-top:4px}
button{border:0;background:#2563eb;color:white;border-radius:9px;padding:9px 12px;cursor:pointer;font-weight:bold}
button:hover{background:#1d4ed8}.qty{font-size:13px;color:#64748b;margin-left:5px}
footer{text-align:center;padding:25px;color:#64748b}
</style>
</head>
<body>
<header><h1>🛒 Smart Shopping</h1><p>Compare products from 4 local shops</p></header>
<div class="container">
<div class="cart">🛍️ Cart: <span><span id="count">0</span> items &nbsp; | &nbsp; <span id="total">₹0</span></span></div>
<div class="shops" id="shops"></div>
</div>
<footer>Demo shopping page • Prices are sample/demo prices</footer>
<script>
const shops=[
["Fresh Mart",[["Rice","₹60/kg",60],["Milk","₹30/1L",30],["Bread","₹40/loaf",40]]],
["Daily Needs",[["Sugar","₹45/kg",45],["Oil","₹140/1L",140],["Biscuits","₹20/pack",20]]],
["Super Store",[["Apples","₹120/kg",120],["Bananas","₹50/dozen",50],["Eggs","₹70/12 pcs",70]]],
["Quick Shop",[["Maggi","₹15/pack",15],["Juice","₹40/pack",40],["Chips","₹20/pack",20]]]
];
let count=0,total=0;
const el=document.getElementById("shops");
shops.forEach(([shop,items])=>{
 const card=document.createElement("div");card.className="shop";
 card.innerHTML=`<h2>${shop}</h2><small>Available items</small>`;
 items.forEach(([name,display,price])=>{
  const row=document.createElement("div");row.className="item";
  row.innerHTML=`<div><strong>${name}</strong><div class="price">${display}</div></div><button>Add to Cart</button>`;
  row.querySelector("button").onclick=()=>{
   count++;total+=price;
   document.getElementById("count").textContent=count;
   document.getElementById("total").textContent="₹"+total;
   row.querySelector("button").textContent="Added ✓";
   setTimeout(()=>row.querySelector("button").textContent="Add to Cart",700);
  };
  card.appendChild(row);
 });
 el.appendChild(card);
});
</script>
</body>
</html>
